# Ruff configuration for wakegen
# Ruff is a fast Python linter written in Rust

# Target Python 3.10+
target-version = "py310"

# Set line length to match Black
line-length = 88

[lint]
# Enable recommended rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by Black)
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[lint.per-file-ignores]
# Ignore import errors in __init__.py files
"__init__.py" = ["F401"]
# Allow unused imports in test files
"tests/*" = ["F401", "F811"]

[format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
